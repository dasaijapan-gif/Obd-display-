; LeanBuddy firmware for the Waveshare ESP32-S3-Touch-LCD-1.28
; (ESP32-S3R2: 2 MB PSRAM, 16 MB flash; GC9A01 240x240 round LCD; QMI8658 IMU; CST816S touch)
;
;   pio run -t upload && pio device monitor
;
; The core (lean estimation, brain, face, renderer) is ../core, shared with the
; tests and the browser simulator.

[platformio]
default_envs = waveshare_s3_lcd128

[env:waveshare_s3_lcd128]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    symlink://../core
